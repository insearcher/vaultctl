[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vaultctl"
version = "0.1.0a1"
description = "Schema-driven CLI for Markdown vaults"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "vaultctl contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "jsonschema>=4.21,<5",
  "ruamel.yaml>=0.18,<0.20",
  "snowballstemmer>=2.2,<4",
]

[project.urls]
Repository = "https://github.com/insearcher/vaultctl"
Issues = "https://github.com/insearcher/vaultctl/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<0.16",
]

[project.scripts]
vaultctl = "vaultctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vaultctl = ["schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
